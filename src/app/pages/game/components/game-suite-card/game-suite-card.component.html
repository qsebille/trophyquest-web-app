<div class="game-suite-card">
  <img [ngSrc]="suite().imageUrl"
       height="90" width="90"
       [alt]="suite().title"
       class="game-suite-card-image">

  <div class="game-suite-card-description">
    <div class="title">
      {{ suite().title }}
      <div class="platforms">
        @for (platform of suite().platforms; track platform) {
          <div class="badge bg-primary">{{ platform }}</div>
        }
      </div>
    </div>

    <tq-trophy-count [platinumCount]="suite().nbPlatinumTrophies"
                     [goldCount]="suite().nbGoldTrophies"
                     [silverCount]="suite().nbSilverTrophies"
                     [bronzeCount]="suite().nbBronzeTrophies"/>
  </div>

  @if (displayMode() == displayModes.MULTIPLE) {
    <div class="game-suite-card-select">
      <button class="btn btn-primary" (click)="selectSuite.emit()">Select</button>
    </div>
  }
</div>
