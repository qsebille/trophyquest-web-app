<div class="home-player-card">
  <img [ngSrc]="player().avatarUrl"
       [height]="95" [width]="95"
       [alt]="player().avatarUrl"
       class="player-avatar"/>

  <div class="player-infos">
    <a class="player-pseudo tq-link" (click)="clickOnPseudo.emit()">
      {{ player().pseudo }}
    </a>

    <div class="player-nb-recent-trophies">
      <b>{{ nbRecentlyEarnedTrophies() | number }}</b>
      <span> recent trophies</span>
    </div>

    <div class="player-recent-trophies-details">
      @for (color of ['bronze', 'silver', 'gold', 'platinum']; track color) {
        @if (getEarnedTrophyByType(color) > 0) {
          <div class="player-trophy-count">
            <img ngSrc="assets/icons/trophy-{{color}}.png"
                 [height]="30" [width]="30"
                 alt="{{color}} trophy"/>
            <div class="player-trophy-count-value">{{ getEarnedTrophyByType(color) }}</div>
          </div>
        }
      }
    </div>
  </div>
</div>
