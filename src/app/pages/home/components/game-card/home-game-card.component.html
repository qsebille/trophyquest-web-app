<div class="home-game-card">
  <img class="game-image" [width]="80" [height]="120" [ngSrc]="game().coverUrl" [alt]="game().title"/>

  <div class="game-info">
    <div class="game-title tq-link" (click)="clickGameTitle.emit()">{{ game().title }}</div>
    <div class="nb-players">
      <mat-icon>groups</mat-icon>
      <span>{{ game().nbRecentPlayers }} player{{ game().nbRecentPlayers > 1 ? 's' : '' }}</span>
    </div>
  </div>
</div>
