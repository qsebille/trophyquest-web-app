<div class="suite-card" [class.suite-card-heading]="heading()">
  <img class="suite-card-image" [src]="suite().imageUrl || '/assets/icons/missing-game-image.svg'"
       [attr.height]="heading() ? 104 : 56" [attr.width]="heading() ? 104 : 56"
       [attr.loading]="heading() ? null : 'lazy'" alt=""/>
  <div class="suite-card-details">
    @if (heading()) {
      <h1>{{ suite().title }}</h1>
    } @else {
      <a class="suite-card-title" [routerLink]="['/suite', suite().suiteId]">{{ suite().title }}</a>
    }
    @if (suite().platforms?.join(' · '); as platforms) {
      <b class="suite-card-platforms">{{ platforms }}</b>
    }
    <ng-content/>
  </div>
</div>
