@if (points().length) {
  <figure>
    <apx-chart
      [chart]="chart"
      [series]="series()"
      [colors]="colors"
      [stroke]="stroke"
      [markers]="markers"
      [xaxis]="xaxis"
      [yaxis]="yaxis"
      [tooltip]="tooltip"
    />
    <figcaption>
      <span>{{ points()[0].sampledAt | date:'short' }} · {{ points()[0].pending | number }} pending</span>
      <span>{{ points()[points().length - 1].sampledAt | date:'short' }}
        · {{ points()[points().length - 1].pending | number }} pending</span>
    </figcaption>
  </figure>
  <details>
    <summary>View recorded counts</summary>
    <dl>
      @for (point of points(); track point.sampledAt) {
        <div>
          <dt>{{ point.sampledAt | date:'short' }}</dt>
          <dd>{{ point.pending | number }}</dd>
        </div>
      }
    </dl>
  </details>
} @else {
  <p>No measurements yet. A measurement is recorded every 15 minutes.</p>
}
