<div class="game-search-page">
  <div class="search-bar">
    <input type="text"
           placeholder="Search games"
           class="search-input"
           aria-label="Search games"
           #searchInput
           [value]="query()"
           (input)="changeSearchQuery(searchInput.value)"/>
  </div>
  <div class="search-results">
    @for (game of loadedGames(); track game; let i = $index) {
      <tq-game-search-card [game]="game"
                           class="search-result"
                           [style.animation-delay.ms]="200 + (i % size()) * 100"
                           animate.enter="block-enter"/>
    }
  </div>

  @if (games.hasValue()) {
    @if (loadedGames().length < games.value().total) {
      <div class="search-pagination">
        <button type="button" class="load-more-button"
                (click)="loadMore()"
                [disabled]="games.isLoading()">
          Load more
        </button>
      </div>
    }
  }
</div>
