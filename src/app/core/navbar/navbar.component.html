<nav class="navigation-bar">
  <div class="navbar-left" routerLink="/home" id="navbar-trophyquest-logo">
    <img alt="" class="navbar-logo" height="32" ngSrc="/assets/icons/trophyquest-icon-32.png" width="32"/>
    <span class="navbar-title">TrophyQuest</span>
  </div>

  <ul class="navbar-links">
    <li><a id="navbar-game-search-link" routerLink="/game-search" routerLinkActive="active">Games</a></li>
    <li><a id="navbar-player-search-link" routerLink="/player-search" routerLinkActive="active">Players</a></li>
    @if (authService.isAdmin()) {
      <li><a id="navbar-association-link" routerLink="/association" routerLinkActive="active">Game Association</a></li>
    }
  </ul>

  @if (authService.isAuthenticated()) {
    <div ngbDropdown>
      <button class="menu-toggle" id="userMenu" ngbDropdownToggle>
        <span class="user-menu-name">{{ currentUserName() }}</span>
      </button>
      <div ngbDropdownMenu aria-labelledby="userMenu" class="dropdown-menu dropdown-menu-end">
        <a ngbDropdownItem routerLink="/account">Account</a>
        <button ngbDropdownItem class="logout-action" (click)="authService.logout()">Logout</button>
      </div>
    </div>
  } @else {
    <div ngbDropdown>
      <button class="menu-toggle" id="registerMenu" ngbDropdownToggle>
        Connect
      </button>
      <div ngbDropdownMenu aria-labelledby="registerMenu" class="dropdown-menu dropdown-menu-end">
        <button ngbDropdownItem (click)="authService.login()">Login</button>
        <button ngbDropdownItem (click)="authService.register()">Register</button>
      </div>
    </div>
  }
</nav>
